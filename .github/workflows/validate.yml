name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 9,950 of 16,700 blocks are generated from pack specs, and every fact
      # base is extracted from the Education OS app. Until v0.47.0 CI checked
      # neither, so both were committed artifacts nothing re-derived. Now the
      # chain is verified from its actual sources: spec -> generated CSV ->
      # blocks.csv.
      - name: Regenerate every pack from its spec
        run: |
          for spec in data/pack_specs/*.json; do
            out="data/generated/$(basename "$spec" .json).csv"
            python3 tools/generate_pack.py "$spec" > "$out"
          done
      - name: Generated packs must match their specs
        run: git diff --exit-code data/generated/
      - name: Re-extract the canonical fact bases from the app
        run: python3 tools/extract_fact_bases.py
      - name: Fact bases must match the app they came from
        run: git diff --exit-code data/louisiana/ data/wlb/
      - name: Rebuild canonical dataset
        run: python3 tools/normalize_blocks.py
      - name: Dataset must be up to date with sources
        run: git diff --exit-code data/blocks.csv data/manifest.json
      - name: Validate dataset
        run: python3 tools/validate_blocks.py
      - name: Validate the Simulation Studio fact base against the dataset
        run: python3 tools/validate_simulations.py
      - name: Regenerate the LSS K–12 standards mapping from the program
        run: python3 tools/generate_standards.py
      - name: Standards mapping must be current with the program
        run: git diff --exit-code data/standards/
      - name: Validate standards mappings and rubrics against the dataset
        run: python3 tools/validate_standards.py
      - name: Regenerate the security and compliance control register
        run: python3 tools/controls_report.py
      - name: Control register must be current and every evidence reference must resolve
        run: git diff --exit-code docs/CONTROL_REGISTER.md
      - name: Regenerate the data-quality dashboard
        run: python3 tools/data_quality.py
      - name: Dashboard must be current with the dataset
        run: git diff --exit-code docs/DATA_QUALITY.md
      - name: Regenerate the state compliance report
        run: python3 tools/compliance_report.py
      - name: Compliance report must be current with its fact base
        run: git diff --exit-code docs/STATE_COMPLIANCE.md

  apps:
    # Build products are never hand-edited: rebuild all six apps from
    # their sources and fail on any drift. This is the reproducible-build
    # guarantee — a fresh clone + Python 3 regenerates the platform
    # byte-for-byte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild all six apps from sources
        run: |
          python3 tools/build_flow_hub.py
          python3 tools/build_louisiana.py
          python3 tools/build_education_os.py
          python3 tools/build_trades.py
          python3 tools/build_states.py
          python3 tools/build_platform.py
      - name: Regenerate the release checksums
        run: python3 tools/checksums.py
      - name: Apps must be byte-identical to their committed builds
        run: git diff --exit-code apps/
      - name: Platform invariants (no network, honesty stances, dataset shape)
        run: python3 tests/test_platform.py
